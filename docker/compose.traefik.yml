services:
  traefik:
    image: traefik
    container_name: traefik
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web

  ferdinand:
    labels:
      - traefik.enable=true
      - traefik.docker.network=ferdinand_web
      - traefik.http.routers.ferdinand.rule=Host(`${FERDINAND_JUPYTER_HOST}`)
      - traefik.http.routers.ferdinand.entrypoints=websecure
      - traefik.http.routers.ferdinand.tls=true
      - traefik.http.services.ferdinand.loadbalancer.server.port=8888
    networks:
      - web

networks:
  web:
    name: ferdinand_web
