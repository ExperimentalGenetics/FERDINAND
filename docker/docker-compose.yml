name: ferdinand

services:
  ferdinand:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ferdinand
    ports:
      - "8888:8888"
    volumes:
      - ../:/app
      - ${FERDINAND_DATA_MOUNT:-../data:/app/data}
      - ${FERDINAND_MODELS_MOUNT:-../models:/app/models}
      - ${FERDINAND_REPORTS_MOUNT:-../reports:/app/reports}
    working_dir: /app
    environment:
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CACHE_HOME=/tmp/.cache
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--ServerApp.token=", "--ServerApp.root_dir=/app", "--ServerApp.allow_origin=*", "--ServerApp.allow_remote_access=True"]
