# GLOBAL CONFIGURATION FILE - imported by all jupyter notebooks
# ==============================================================

# config.example.yml

#
# Settings controlling the dataset creation pipeline run.
# These define how the run is executed, identified, and documented.
#
run_mode: &run_mode your_run_mode_here
  # <-- CHANGE ME: Execution mode
  #     REAL = process full dataset (downloads everything)
  #     TEST = process a small subset (e.g. first 20 rows)

run_name: &run_name your_run_name_here
  # <-- CHANGE ME: Unique name for this run
  #     Used in output directories and reports (avoid spaces/special characters)

run_description: &run_description your_run_description_here
  # <-- CHANGE ME: Short description of the run purpose (free text)

data_source: &data_source "IMPC"
  # Data source identifier (usually does not need to be changed)

#
# List of IMPC centers to be included in the dataset.
# Only data from these centers will be processed.
#
centers:
  - WTSI         # Wellcome Sanger Institute
  - JAX          # The Jackson Laboratory
  - MRC Harwell  # MRC Harwell Institute
  - UC Davis     # University of California, Davis
  - HMGU         # Helmholtz Munich
  - CCP-IMG      # Czech Centre for Phenogenomics
  - TCP          # Toronto Centre for Phenogenomics
  - BCM          # Baylor College of Medicine
  - ICS          # Institut Clinique de la Souris
  - RBRC         # RIKEN BioResource Center
  - KMPC         # Korea Mouse Phenotyping Center
  - MARC         # Monash Animal Research Platform

#
# List of mouse metadata fields to retrieve from the IMPC API
# and store in the local SQLite database.
#
mouse_columns:
  - center        # IMPC center where the mouse was phenotyped
  - mouse_id      # Unique identifier of the mouse
  - strain        # Genetic background / mouse strain
  - dob           # Date of birth
  - sex           # Biological sex (e.g. male/female)
  - cohort_type   # Cohort classification (e.g. control, mutant)
  - gene_symbol   # Targeted gene symbol (if applicable)

#
# Additional image-related metadata fields to fetch from the IMPC API
# and store in the local SQLite database.
# These fields are added on top of the default `api_fields` defined in the code.
#
additional_api_fields:  # optional: leave empty or omit if no extra fields are needed
  # - field_name_1   # <-- ADD FIELD: name as defined in the IMPC API
  # - field_name_2

#
# List of parameters defining which images are included in the dataset.
# Each entry specifies an IMPC procedure, including its stable ID,
# a human-readable description, the scheduled week, and a short name
# used in the dataset directory structure.
#
parameters:
  - stable_id: "IMPC_XRY_034_001"   # IMPC procedure stable ID (unique identifier)
    description: "whole body X-Ray dorso-ventral"  # Description of the image type
    week: "14"                     # Scheduled week of the procedure (e.g. mouse age in weeks)
    work_name: "xray_dv"           # Short, filesystem-friendly name used in folder structure

#
# Maximum allowed deviation (in weeks) from the scheduled procedure week.
# Images are included if their week lies within:
#   [due_week - max_pipeline_deviation, due_week + max_pipeline_deviation]
# Example: due_week = 14 and max_pipeline_deviation = 5 → include weeks 9–19 (inclusive)
#
max_pipeline_deviation: 5

#
# Root directory of the project.
# This is the base path containing subdirectories for data, reports, models,
# and the SQLite database.
#
project_root: ".."

#
# Base directory for all dataset-related data, including raw data,
# processed data, and the SQLite database.
#
data_dir: "data"

#
# Subdirectory structure within `data_dir`.
# Each directory corresponds to a specific stage in the data pipeline.
# Numeric prefixes indicate processing order.
#
data_directories:
  all_data_dir: "000_all_data"                  # Root container for all collected data
  raw_data_dir: "100_raw_data"                  # Raw data as downloaded from the source
  center_data_dir: "110_center_data"            # Data grouped or split by IMPC center
  images_dir: "200_all_images"                  # All original images
  thumbnails_dir: "210_all_thumbnails"          # Thumbnails of original images
  preprocessed_dir: "300_preprocessed_images"   # Images after preprocessing steps
  preprocessed_thumbnails_dir: "310_preprocessed_thumbnails"  # Thumbnails of preprocessed images
  rotated_dir: "400_rotated_images"             # Images after rotation/alignment
  rotated_thumbnails_dir: "410_rotated_thumbnails"  # Thumbnails of rotated images

#
# Directory for storing all reports generated by the dataset creation pipeline,
# including quality control reports and orientation angle prediction reports.
#
reports_dir: "reports"

#
# Directory for storing all models used in the dataset creation pipeline.
#
models_dir: "models"

#
# Name or path of the angle detection model used to predict
# the orientation angle of images in the dataset.
#
angle_detection_model: your_model_here  # <-- CHANGE ME: e.g. filename or relative path within models_dir

#
# Name of the SQLite database (without .db extension).
# The database will be created in `all_data_dir` and stores:
# - image metadata
# - quality control results
# - orientation angle predictions
#
sqlite_db: "IMPC_radiographs"

#
# Consolidated settings summary.
# This section reuses previously defined values (via YAML anchors)
# to provide a single, convenient overview of the current configuration.
#
settings:
  run_mode: *run_mode
  run_name: *run_name
  run_description: *run_description
  data_source: *data_source

#
# Docker-related settings for running the pipeline container and accessing Jupyter.
#
docker_user_id: 0                # User ID used to run the container (0 = root)
docker_group_id: your_group_id   # <-- CHANGE ME: your local group ID (run `id -g`)
jupyter_host: your_host_name     # <-- CHANGE ME: hostname or domain (e.g. localhost or your.domain.com)
jupyter_port: your_jupyter_port  # <-- CHANGE ME: host port mapped to the container (e.g. 8888)
