# GLOBAL CONFIGURATION FILE - imported by all jupyter notebooks
# ==============================================================

# Run configuration
run_name: &run_name "2025-09-23"
run_description: &run_description "test_run"
data_source: &data_source "IMPC"

# IMPC centers
centers:
  - WTSI
  - JAX
  - MRC Harwell
  - UC Davis
  - HMGU
  - CCP-IMG
  - TCP
  - BCM
  - ICS
  - RBRC
  - KMPC
  - MARC

# Mouse columns
mouse_columns:
  - center
  - mouse_id
  - strain
  - dob
  - sex
  - cohort_type
  - gene_symbol

# additional fields to be fetched from the API and stored in the database
additional_api_fields:

# Parameters related to radiographs of interest
parameters:
  - stable_id: "IMPC_XRY_034_001"
    description: "whole body X-Ray dorso-ventral"
    week: "14"
    work_name: "xray_dv"

# Maximum weeks of deviation from the due week according to the pipeline
max_pipeline_deviation: 5

# Settings summary
settings:
  run_name: *run_name
  run_description: *run_description
  data_source: *data_source

project_root: ".."
data_dir: "full_data"
reports_dir: "reports"
sqlite_db: "IMPC_radiographs"
# angle detection model trained on a subset of the data, to be used for predicting the rotation angle of images in the dataset
angle_detection_model: "2026-02-09_rotation_cnn_model.h5"

directories:
  models_dir: "000_models"
  raw_data_dir: "010_raw_data"
  center_data_dir: "020_center_data"
  all_data_dir: "030_all_data"
  images_dir: "040_all_images"
  thumbnails_dir: "041_all_thumbnails"
  preprocessed_dir: "050_preprocessed_images"
  preprocessed_thumbnails_dir: "051_preprocessed_thumbnails"
  rotated_dir: "055_rotated_images"
  rotated_thumbnails_dir: "056_rotated_thumbnails"